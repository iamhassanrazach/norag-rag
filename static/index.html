<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RAG V2</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:1.5rem auto;padding:0 1rem;color:#222}
nav button{padding:.5rem 1rem;border:1px solid #888;background:#eee;cursor:pointer}
nav button.on{background:#222;color:#fff}
.bar{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;margin:1rem 0;padding:.6rem;background:#f4f4f4}
input,select,textarea{padding:.3rem}textarea{width:100%}
table{border-collapse:collapse;margin:.5rem 0;font-size:.9rem}td,th{border:1px solid #ccc;padding:.25rem .5rem;text-align:left}
.chunk{border:1px solid #ccc;padding:.5rem;margin:.4rem 0;white-space:pre-wrap;font-size:.85rem}
.err{color:#b00020;font-weight:600}.muted{color:#999}.ok{color:#0a7d2c}.ko{color:#b00020}
a.w{cursor:pointer;color:#0645ad;text-decoration:underline}
</style></head><body>
<h1>RAG V2</h1>
<div class="bar">
 Corpus <select id="corpus"></select>
 Chunk size <input id="cs" type="number" value="800" min="100" max="4000" style="width:5rem">
 Overlap % <input id="ov" type="number" value="10" min="0" max="50" style="width:4rem">
 Top-k <input id="k" type="number" value="5" min="1" max="10" style="width:3.5rem">
</div>
<nav><button data-t="ask" class="on">Ask</button> <button data-t="eval">Evaluation</button> <button data-t="words">Words</button></nav>
<div id="msg" class="err"></div>

<section id="ask">
 <p><select id="qpick"><option value="">- pick a question from the set -</option></select></p>
 <textarea id="q" rows="2" placeholder="Your question"></textarea>
 <p><button onclick="ask()">Ask</button> <button onclick="searchOnly()">Search only (no LLM)</button></p>
 <div id="ask-out"></div>
</section>

<section id="eval" hidden>
 <p><label><input type="checkbox" id="wa"> also generate answers (LLM calls, slower)</label>
 <button onclick="runEval()">Run evaluation</button></p>
 <p class="muted">Uses the corpus, chunk size and overlap above. Results are saved in results/. Same as: python evaluate.py &lt;corpus&gt;</p>
 <div id="eval-out"></div>
</section>

<section id="words" hidden>
 <h3>Corpus mode</h3>
 <p>Vocabulary filter: <input id="vf" placeholder="contains..." oninput="vocab()"> <span id="vinfo" class="muted"></span></p>
 <div id="vocab-out" style="max-height:260px;overflow:auto"></div>
 <p>Word → chunks: <input id="wq" placeholder="a word"> <button onclick="wordChunks(wq.value)">Find</button></p>
 <div id="word-out"></div>
 <h3>Question mode</h3>
 <p><select id="wpick"><option value="">- pick a question from the set -</option></select></p>
 <textarea id="wtext" rows="2" placeholder="or type a question"></textarea>
 <p><button onclick="qWords()">Question → words</button> <label><input type="checkbox" id="hs" checked onchange="qWords()"> hide stop words</label></p>
 <div id="qwords-out"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=()=>({corpus:$('corpus').value,chunk_size:+$('cs').value,overlap_percent:+$('ov').value});
const qs=o=>new URLSearchParams(o).toString();
let QUESTIONS=[];

async function api(url,body){
  $('msg').textContent='';
  try{
    const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
    const d=await r.json();
    if(!r.ok){$('msg').textContent=typeof d.detail==='string'?d.detail:'Invalid input: '+JSON.stringify(d.detail);return null}
    return d;
  }catch(e){$('msg').textContent='Cannot reach the server: '+e;return null}
}
const chunkHtml=c=>`<div class="chunk"><b>${esc(c.source)}</b> #${c.chunk_index}${c.distance!==undefined?` · distance ${c.distance.toFixed(3)}`:''}${c.relevant===true?' <span class="ok">relevant</span>':''}\n${esc(c.text)}</div>`;

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['ask','eval','words'].forEach(t=>$(t).hidden=t!==b.dataset.t);
  if(b.dataset.t==='words')vocab();
});

async function loadCorpora(){
  const cs=await api('/api/corpora'); if(!cs)return;
  $('corpus').innerHTML=cs.map(c=>`<option value="${c.name}">${c.name} (${c.documents} docs, ${c.questions} questions)</option>`).join('');
  $('corpus').onchange=loadQuestions; loadQuestions();
}
async function loadQuestions(){
  QUESTIONS=await api('/api/questions?'+qs({corpus:$('corpus').value}))||[];
  const opts='<option value="">- pick a question from the set -</option>'+QUESTIONS.map(q=>`<option value="${q.id}">${q.id} [${q.type}] ${esc(q.question)}</option>`).join('');
  $('qpick').innerHTML=opts;$('wpick').innerHTML=opts;
}
$('qpick').onchange=()=>{const q=QUESTIONS.find(x=>x.id===$('qpick').value);if(q)$('q').value=q.question};
$('wpick').onchange=()=>{const q=QUESTIONS.find(x=>x.id===$('wpick').value);if(q){$('wtext').value=q.question;qWords()}};

async function ask(){
  $('ask-out').innerHTML='Thinking...';
  const d=await api('/api/ask',{...cfg(),question:$('q').value,k:+$('k').value});
  $('ask-out').innerHTML=d?`<h3>Answer ${d.in_documents?'':'<span class="muted">(not in the documents)</span>'}</h3><p>${esc(d.answer)}</p><h3>References (top ${d.chunks.length})</h3>${d.chunks.map(chunkHtml).join('')}`:'';
}
async function searchOnly(){
  const d=await api('/api/search',{...cfg(),question:$('q').value,k:+$('k').value});
  $('ask-out').innerHTML=d?`<h3>Retrieved chunks</h3>${d.chunks.map(chunkHtml).join('')}`:'';
}

function table(rows,head){return `<table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`}
async function runEval(){
  $('eval-out').innerHTML='Running...';
  const d=await api('/api/eval/run',{...cfg(),with_answers:$('wa').checked,answer_k:+$('k').value});
  if(!d){$('eval-out').innerHTML='';return}
  const ks=d.meta.ks,s=d.summary;
  const rows=[['OVERALL',s.overall],...Object.entries(s.by_type)].map(([n,b])=>[n,b.n,...ks.flatMap(k=>[b[k].hit_rate,b[k].recall])]);
  let h=`<p>${d.meta.n_chunks} chunks · ${d.meta.n_scored} scored questions · saved to <code>${esc(d.saved_to)}</code></p>`+
    table(rows,['type','n',...ks.flatMap(k=>['hit@'+k,'rec@'+k])]);
  if(d.unreachable_evidence.length)h+=`<p class="err">${d.unreachable_evidence.length} evidence quote(s) cut by a chunk boundary: ${d.unreachable_evidence.map(u=>u.id).join(', ')}</p>`;
  h+='<h3>Per question (top 10)</h3>'+table(d.questions.map(q=>[q.id,q.type,esc(q.question),
    q.answerable?q.retrieved.map(c=>c.relevant?'●':'○').join(''):'<span class="muted">unanswerable</span>',
    q.answer?esc(q.answer.text||q.answer.error):''] ),['id','type','question','top-10 (● relevant)','answer']);
  $('eval-out').innerHTML=h;
}

async function vocab(){
  const d=await api('/api/words/vocabulary?'+qs({...cfg(),contains:$('vf').value}));if(!d)return;
  $('vinfo').textContent=`${d.distinct_words} distinct words, ${d.total_words} in total (showing ${d.shown.length})`;
  $('vocab-out').innerHTML=table(d.shown.map(r=>[`<a class="w" onclick="wordChunks('${esc(r.word)}')">${esc(r.word)}</a>`,r.count,r.chunks]),['word','count','in how many chunks']);
}
async function wordChunks(w){
  if(!w)return; $('wq').value=w;
  const d=await api('/api/words/word?'+qs({...cfg(),word:w}));if(!d)return;
  $('word-out').innerHTML=d.chunks.length?`<p><b>${esc(d.word)}</b>: ${d.total} times in ${d.chunks.length} chunks</p>`+d.chunks.map(c=>`<div class="chunk"><b>${esc(c.source)}</b> #${c.chunk_index} · ${c.count}×\n${esc(c.text)}</div>`).join(''):`<p class="err">"${esc(d.word)}" does not exist in the corpus.</p>`;
}
async function qWords(){
  const d=await api('/api/words/question',{...cfg(),question:$('wtext').value});if(!d)return;
  const rows=d.words.filter(r=>!($('hs').checked&&r.stopword)).map(r=>[
    r.exists?`<a class="w" onclick="wordChunks('${esc(r.word)}')">${esc(r.word)}</a>`:`<span class="ko">${esc(r.word)}</span>`,
    r.exists?'<span class="ok">exists</span>':'<span class="ko">ABSENT</span>',r.total,r.n_chunks,
    r.chunks.slice(0,6).map(c=>esc(c.id)+' ('+c.count+')').join(', ')+(r.chunks.length>6?' …':'')]);
  $('qwords-out').innerHTML=table(rows,['word','in corpus?','times','chunks','which chunks']);
}
loadCorpora();
</script></body></html>
